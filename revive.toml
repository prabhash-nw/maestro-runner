# revive configuration
# Excludes test files and mock packages from all lint rules.

ignoreGeneratedHeader = false
severity = "warning"
confidence = 0.8

# Exclude test files and mock packages
excludes = [
  ".*_test\\.go",
  ".*/mock/.*",
  ".*/node_modules/.*",
]

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.error-return]
[rule.error-strings]
[rule.error-naming]
[rule.exported]
  # Disable stutter check: established type names (e.g. DeviceLabClient,
  # FlutterDriver, SimulatorDevice) are part of the public API and renaming
  # would be a breaking change across callers.
  arguments = ["disableStutteringCheck"]
[rule.if-return]
[rule.increment-decrement]
[rule.var-naming]
[rule.var-declaration]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.time-naming]
[rule.unexported-return]
[rule.indent-error-flow]
[rule.errorf]
[rule.empty-block]
[rule.superfluous-else]
[rule.unused-parameter]
[rule.unreachable-code]
[rule.redefines-builtin-id]
